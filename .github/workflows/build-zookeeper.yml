name: build-mongo

on:
  schedule:
    - cron: '0 0 */14 * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: [8.0.17]

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Log in to Docker Hardened Images (dhi.io)
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.TEMP_DOCKER_USER }}
          password: ${{ secrets.TEMP_DOCKER_PAT }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Alpine Base (Hardened)
        run: |
          docker buildx build \
            https://raw.githubusercontent.com/souravbiswassanto/catalog/refs/heads/main/image/postgres/debian-13/18.yaml \
            --platform linux/amd64,linux/arm64 \
            --tag souravbiswassanto/pg-dhi:18 \
            --tag souravbiswassanto/pg-dhi:18-${{ github.sha }} 

      # Add your Mongo build steps here later
      # Example:
      # - name: Build MongoDB
      #   run: |
      #     docker buildx build \
      #       https://raw.githubusercontent.com/docker-hardened-images/catalog/refs/heads/main/image/mongo/... \
      #       --platform linux/amd64,linux/arm64 \
      #       --push