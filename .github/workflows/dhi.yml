name: build-mongo

on:
  schedule:
    - cron: '0 0 */14 * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: [8.0.17, 8.0.10, 7.0.28, 7.0.21, 6.0.24, 5.0.31, 4.4.26]

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Log in to Docker Hardened Images (dhi.io)
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Alpine Base (Hardened)
        run: |
          docker buildx build \
            https://raw.githubusercontent.com/docker-hardened-images/catalog/refs/heads/main/image/alpine-base/alpine-3.23/3.23.yaml \
            --platform linux/amd64,linux/arm64 \
            --sbom=generator=dhi.io/scout-sbom-indexer:1 \
            --provenance=1 \
            --tag ghcr.io/${{ github.repository_owner }}/alpine-base:3.23 \
            --tag ghcr.io/${{ github.repository_owner }}/alpine-base:3.23-${{ github.sha }}

      # Add your Mongo build steps here later
      # Example:
      # - name: Build MongoDB
      #   run: |
      #     docker buildx build \
      #       https://raw.githubusercontent.com/docker-hardened-images/catalog/refs/heads/main/image/mongo/... \
      #       --platform linux/amd64,linux/arm64 \
      #       --push