name: refresh-library

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: write
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.25'

    - name: Generate LGTM App token
      id: lgtm-app-token
      uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3
      with:
        permission-contents: write
        permission-workflows: write
        client-id: ${{ secrets.LGTM_APP_CLIENT_ID }}
        private-key: ${{ secrets.LGTM_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}

    - name: Prepare git
      env:
        LGTM_APP_TOKEN: ${{ steps.lgtm-app-token.outputs.token }}
      run: |
        set -x
        git config --global user.name "1gtm-app[bot]"
        git config --global user.email "3686661+1gtm-app[bot]@users.noreply.github.com"
        git config --global \
          url."https://x-access-token:${LGTM_APP_TOKEN}@github.com".insteadOf \
          "https://github.com"
        git remote set-url origin https://x-access-token:${LGTM_APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git

    - name: Refresh Library
      run: |
        go run cmd/refresh-library/*.go
        # https://stackoverflow.com/a/23930212
        cat > ./library/README.md <<- EOM
        # Docker Library
        Last Updated: $(date --rfc-3339=date)
        EOM

    - name: Generate Workflows
      run: |
        go run cmd/generate-workflows/*.go

    # - name: Setup upterm session
    #   uses: lhotari/action-upterm@v1

    - name: Update repo
      run: |
        git add --all
        if [[ $(git status --porcelain) ]]; then
          git commit -s -a -m "update libary $(date --rfc-3339=date)"
          git fetch origin
          git pull --rebase origin master
          git push origin HEAD
        fi
